<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a0f"/>
      <stop offset="60%" stop-color="#0d1422"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#080a0f" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle Blueprint Grid -->
  <g stroke="rgba(247,245,239,0.06)" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="280" y1="0" x2="280" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="680" y1="0" x2="680" y2="630"/>
    <line x1="880" y1="0" x2="880" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="440" x2="1200" y2="440"/>
  </g>

  <!-- Top Monospace Bar -->
  <text x="80" y="80" font-family="'DM Mono', monospace, monospace" font-size="16" letter-spacing="3" fill="#9ba2ae" text-transform="uppercase">TRIXELTECH® / DIGITAL ARCHITECTURE &amp; AUTOMATION / NIGERIA</text>
  <circle cx="1100" cy="75" r="7" fill="#d7ff38"/>

  <!-- Brand Title -->
  <g transform="translate(80, 210)">
    <text font-family="'Impact', 'Archivo Black', sans-serif" font-size="78" font-weight="900" fill="#f7f5ef" letter-spacing="-2" line-height="0.9">
      WEBSITES. BOTS.
    </text>
    <text y="85" font-family="'Impact', 'Archivo Black', sans-serif" font-size="78" font-weight="900" fill="#2563eb" letter-spacing="-2">
      ONLINE STORES.
    </text>
    <text y="165" font-family="'Impact', 'Archivo Black', sans-serif" font-size="52" font-weight="900" fill="#d7ff38" letter-spacing="-1">
      FIXED PRICING FROM ₦20,000.
    </text>
  </g>

  <!-- Tagline / Value Proposition -->
  <text x="80" y="470" font-family="'Manrope', Arial, sans-serif" font-size="22" font-weight="500" fill="#c3cad4">
    Fast 3-day delivery. Telegram bots that reply in 2 seconds. You own 100% of your code and domain.
  </text>

  <!-- Bottom Badges -->
  <g transform="translate(80, 530)">
    <!-- Badge 1 -->
    <rect width="180" height="42" rx="4" fill="#111e33" stroke="rgba(37,99,235,0.4)" stroke-width="1"/>
    <text x="18" y="26" font-family="'DM Mono', monospace" font-size="13" font-weight="700" fill="#f7f5ef">🚀 3-DAY TARGET</text>

    <!-- Badge 2 -->
    <rect x="200" width="230" height="42" rx="4" fill="#111e33" stroke="rgba(37,99,235,0.4)" stroke-width="1"/>
    <text x="218" y="26" font-family="'DM Mono', monospace" font-size="13" font-weight="700" fill="#f7f5ef">💬 WHATSAPP +234 704 299 8527</text>

    <!-- Badge 3 -->
    <rect x="450" width="200" height="42" rx="4" fill="#111e33" stroke="rgba(215,255,56,0.3)" stroke-width="1"/>
    <text x="468" y="26" font-family="'DM Mono', monospace" font-size="13" font-weight="700" fill="#d7ff38">✓ FIXED PRICE FIRST</text>
  </g>
</svg>
